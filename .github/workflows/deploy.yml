name: Deploy to GitHub Pages

# Custom workflow instead of the default Pages build: the default build clones
# submodules and fails on the private `note` submodule (repository not found),
# which froze all deploys. actions/checkout defaults to submodules: false, so
# the static site deploys cleanly without touching the submodule.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
